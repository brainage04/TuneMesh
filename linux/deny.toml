# cargo-deny (https://embarkstudios.github.io/cargo-deny/): RustSec
# advisories, licences, duplicate crates and crate sources of `linux/`.
#
#   nix develop -c bash -c 'cd linux && cargo deny check'

[graph]
# What the release builds target (packaging/ builds both).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included;
# an exception goes in `ignore` with the reason.
unmaintained = "all"
yanked = "deny"
ignore = [
    # paste (lofty's macros): unmaintained, no successor; compile-time only.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; only lofty's proc macros use it" },
    # zbus's helper crates (mpris-server): merged back into zbus, which
    # mpris-server 0.10 has not moved to yet. Not a vulnerability.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus; waiting for mpris-server" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus; waiting for mpris-server" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus; waiting for mpris-server" },
]

[licenses]
# The licences packaging/licenses/about.toml accepts for the crates linked
# into the binaries (their texts are bundled in THIRD-PARTY-RUST.txt), so
# both tools agree on what may be shipped next to TuneMesh's MIT licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The list mirrors about.toml, so not every entry is in use.
unused-allowed-license = "allow"

[licenses.private]
# TuneMesh's own crates (MIT, `publish = false`).
ignore = true

[bans]
# Two versions of one crate cost build time and size but are not a defect:
# reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
