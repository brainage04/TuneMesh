[workspace]
resolver = "3"
members = ["crates/tunemesh-core", "crates/tunemesh", "crates/tunemesh-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tunemesh-core = { path = "crates/tunemesh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
humantime = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
# Unwind, so a panic in a tag parser on a synced file can be caught
# (tunemesh_core::library::guarded) instead of ending the process.
panic = "unwind"
