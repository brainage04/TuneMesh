[package]
name = "tunemesh"
description = "TuneMesh: a GTK 4 music player for a Syncthing-shared library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tunemesh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
fastrand.workspace = true
anyhow.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
libc = "0.2"
glib-unix = "0.22"
mpris-server = "0.10"
notify = "8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
toml = "1"
# Syncthing's REST API (setup assistant); rustls, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
roxmltree = "0.20"
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
glib-build-tools = "0.22"
