[package]
name = "tunemesh-core"
description = "TuneMesh library format: scanning, playlists, download requests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
fastrand.workspace = true
humantime.workspace = true
lofty = "0.25"
rustix = { version = "1", features = ["fs", "process"] }
unicode-normalization = "0.1"

[features]
# The hostile-library generator (`hostile`, `examples/hostile_library.rs`).
hostile = []

[[example]]
name = "hostile_library"
required-features = ["hostile"]

[dev-dependencies]
tempfile = "3"
