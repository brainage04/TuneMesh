[package]
name = "tunemesh-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace (nightly only; excluded from `linux/Cargo.toml`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
tunemesh-core = { path = "../crates/tunemesh-core" }
tunemesh-worker = { path = "../crates/tunemesh-worker", features = ["fuzzing"] }

[profile.release]
debug = 1

[[bin]]
name = "playlist_parse"
path = "fuzz_targets/playlist_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "playlist_edits"
path = "fuzz_targets/playlist_edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_files"
path = "fuzz_targets/json_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "status_limits"
path = "fuzz_targets/status_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "links"
path = "fuzz_targets/links.rs"
test = false
doc = false
bench = false

[[bin]]
